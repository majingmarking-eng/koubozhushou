<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f5f1" />
  <title>跟着说 · 自媒体人口播录制助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .home-head{display:flex;justify-content:space-between;align-items:end;margin:12px 0 35px}.home-head h1{font-size:46px;letter-spacing:-.06em;margin:10px 0 8px}.home-head p{margin:0;color:var(--muted);font-size:14px}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.script-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:21px;text-align:left;min-height:190px;transition:.2s;position:relative}.script-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#a9bd8f}.card-open{display:block;background:transparent;text-align:left;width:100%;padding:0;color:inherit}.card-top{display:flex;justify-content:space-between;color:var(--muted)}.script-dot{color:var(--orange);font-size:17px}.more{letter-spacing:2px}.script-card h2{font-size:19px;letter-spacing:-.04em;margin:22px 0 25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-meta{display:flex;gap:13px;color:var(--muted);font-size:11px}.card-progress{height:4px;background:#e7e8e1;border-radius:5px;margin-top:20px}.card-progress b{display:block;height:100%;background:var(--green-dark);border-radius:5px}.delete-script{background:transparent;color:#b95048;font-size:11px;padding:12px 0 0}.empty{text-align:center;grid-column:1/-1;padding:60px}.empty-icon{font-size:38px;color:var(--orange)}.empty h2{margin:13px 0 5px}.empty p{color:var(--muted);font-size:13px;margin-bottom:20px}.folder-bar{display:flex;justify-content:space-between;align-items:center;margin-top:27px;color:var(--muted);font-size:12px;padding:0 4px}.settings-panel{max-width:720px}.settings-help{color:var(--muted);font-size:13px;line-height:1.8}.settings-help code{background:#eef0e8;border-radius:4px;padding:2px 5px}.settings-status{font-size:12px;color:var(--green-dark);margin-top:20px}@media(max-width:760px){.home-head{align-items:start;gap:18px;flex-direction:column}.home-head h1{font-size:36px}.catalog{grid-template-columns:1fr}}
    @media(max-width:600px){body{overflow-x:hidden}.topbar{height:64px;padding:0 16px}.brand{font-size:18px;gap:7px}.brand small{display:none}.brand-mark{width:26px;height:26px}.topbar-right{gap:8px}.storage-pill{font-size:10px}main{padding:28px 16px 58px}.flow{gap:5px;overflow-x:auto;white-space:nowrap;margin-bottom:23px;padding-bottom:2px}.flow span{font-size:10px;padding:7px 9px}.hero{margin-bottom:28px}.hero h1{font-size:32px;line-height:1.2}.hero p{font-size:14px;line-height:1.7}.panel{padding:20px;border-radius:17px}textarea{height:230px;font-size:15px}.actions{align-items:stretch;flex-direction:column;gap:10px}.actions .primary,.actions .secondary{width:100%}.choice-head{margin:34px 0 14px}.choice-head h2{font-size:20px;line-height:1.4}.choice{min-height:135px;padding:18px}.choice-icon{font-size:23px;margin-bottom:8px}.two-col{display:block}.side-card{display:none}.home-head{margin:5px 0 27px}.home-head h1{font-size:34px}.home-head .primary{width:100%}.script-card{min-height:165px;padding:18px}.script-card h2{margin:17px 0 19px}.card-meta{gap:9px;flex-wrap:wrap}.folder-bar{align-items:flex-start;gap:7px;flex-direction:column}.recorder-top{align-items:flex-start;gap:12px;flex-direction:column}.recorder-top h1{font-size:25px}.progress-count{font-size:11px}.sentence-stage{min-height:310px;padding:36px 18px}.sentence-stage .current{font-size:24px;line-height:1.45}.sentence-stage .prev,.sentence-stage .next{max-width:100%;font-size:11px}.rec-controls{gap:8px}.rec-controls button{width:100%;padding:12px 10px}.review-title{align-items:flex-start;gap:10px;flex-direction:column}.review-title h1{font-size:27px}.review-row{grid-template-columns:27px 1fr;gap:8px 10px;padding:13px}.review-row .duration{grid-column:2}.review-row>span:last-child{grid-column:2;display:flex;gap:8px}.review-row .row-btn{grid-column:auto;padding:0}.studio-header{gap:14px;flex-direction:column}.studio h1{font-size:28px}.studio-card{padding:34px 18px;border-radius:19px}.studio-card h2{font-size:25px;line-height:1.5;margin:21px 0 27px}.studio-actions{gap:8px}.studio-actions button{width:100%}.studio .actions .notice{order:3;margin:2px 0}.queue{gap:5px;max-width:100%;overflow:hidden}.settings-panel{padding:20px}.settings-help{font-size:12px}}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">↗</span><span>跟着说</span><small>口播录制助手</small></div>
      <div class="topbar-right"><span class="storage-pill"><i></i> 浏览器语音模式</span><button class="icon-btn" id="helpBtn" title="使用说明">?</button></div>
    </header>
    <main id="app"></main>
    <div id="toast" class="toast"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
